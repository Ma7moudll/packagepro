name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: packagepro
          POSTGRES_PASSWORD: packagepro123
          POSTGRES_DB: packagepro_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npm run prisma:generate

      - name: Run database migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://packagepro:packagepro123@localhost:5432/packagepro_test
        run: npx prisma migrate deploy

      - name: Seed isolated test fixtures
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://packagepro:packagepro123@localhost:5432/packagepro_test
        run: npm run prisma:seed

      - name: Run linter
        working-directory: ./backend
        run: npm run lint

      - name: Run tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://packagepro:packagepro123@localhost:5432/packagepro_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret
          NODE_ENV: test
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          DHL_API_KEY: test
          DHL_API_SECRET: test
          # Hard containment: the DHL suites stub axios, but if a stub ever failed
          # to install, a carrier call would hit loopback port 9, never api.dhl.com.
          DHL_BASE_URL: http://127.0.0.1:9
          # Select the in-process JSON email transport (refused unless NODE_ENV=test).
          # SMTP_HOST/SMTP_PORT below are NOT read by backend/src/services/email;
          # without EMAIL_PROVIDER=test the service dials smtp.sendgrid.net.
          EMAIL_PROVIDER: test
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: 9
        run: npm test -- --run

      - name: Build
        working-directory: ./backend
        run: npm run build

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run linter
        working-directory: ./frontend
        run: npm run lint

      - name: Run tests
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
        run: npm run test:units

      - name: Typecheck frontend
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
        run: npm run build

      - name: Install browser for editor compatibility smoke
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Smoke test actual production editor route
        working-directory: ./frontend
        run: npx playwright test --config=playwright.compatibility.config.ts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            frontend/.next/**
            !frontend/.next/cache/**
            !frontend/.next/**/.env*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install audit dependencies
        run: |
          npm ci --ignore-scripts --prefix backend
          npm ci --ignore-scripts --prefix frontend

      - name: Audit Backend dependencies
        working-directory: ./backend
        run: npm audit --audit-level=moderate

      - name: Audit Frontend dependencies
        working-directory: ./frontend
        run: npm audit --audit-level=moderate

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: packagepro-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: false
          tags: packagepro-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
