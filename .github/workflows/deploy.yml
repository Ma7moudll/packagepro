name: Deploy to Production

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.REGISTRY_URL }}/packagepro-backend:latest
          cache-from: type=registry,ref=${{ secrets.REGISTRY_URL }}/packagepro-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.REGISTRY_URL }}/packagepro-backend:buildcache,mode=max
      
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.REGISTRY_URL }}/packagepro-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=registry,ref=${{ secrets.REGISTRY_URL }}/packagepro-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.REGISTRY_URL }}/packagepro-frontend:buildcache,mode=max
      
      - name: Deploy to production
        run: |
          echo "Deployment would happen here"
          echo "Backend image: ${{ secrets.REGISTRY_URL }}/packagepro-backend:latest"
          echo "Frontend image: ${{ secrets.REGISTRY_URL }}/packagepro-frontend:latest"

