version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: packagepro-postgres
    environment:
      POSTGRES_USER: packagepro
      # Required: no committed default. Set it in a local .env (git-ignored).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      POSTGRES_DB: packagepro
    ports:
      # Localhost-only: the database must not be reachable from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U packagepro"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: packagepro-redis
    ports:
      # Localhost-only: same reasoning as Postgres.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: packagepro-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://packagepro:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}@postgres:5432/packagepro?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 3000
      # Required: no committed defaults. The backend refuses to boot without them.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in your .env file}
      # Signs /api/files/* URLs (32+ characters). Not bound to a user or an order.
      FILE_URL_SIGNING_SECRET: ${FILE_URL_SIGNING_SECRET:?Set FILE_URL_SIGNING_SECRET (32+ characters) in your .env file}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/prisma:/app/backend/prisma
    command: >
      sh -c "npx prisma migrate deploy &&
             npm run start"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
    container_name: packagepro-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NODE_ENV: production
    ports:
      - "3001:3001"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:

